services:
  - type: web
    name: alzheimers-ai-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python run_backend.py
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "1440"
      - key: CORS_ORIGINS
        sync: false
      - key: ALZHEIMERS_DB_PATH
        sync: false
      - key: MODEL_CHECKPOINT_PATH
        sync: false
      - key: MODEL_CHECKPOINT_SHA256
        sync: false
      - key: MODEL_ARTIFACT_URL
        sync: false
      - key: MODEL_ARTIFACT_TOKEN
        sync: false