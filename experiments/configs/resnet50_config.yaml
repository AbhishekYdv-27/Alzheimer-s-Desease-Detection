#!/usr/bin/env python3

model: ResNet50
architecture: ResNet50
num_classes: 4
class_names:
  - NonDemented
  - VeryMildDemented
  - MildDemented
  - ModerateDemented

model_config:
  pretrained: false
  freeze_backbone: false
  dropout_rate: 0.5
  input_size: [224, 224]
  input_channels: 3

training_config:
  batch_size: 32
  num_epochs: 50
  learning_rate: 0.001
  weight_decay: 0.0001
  optimizer: adam
  scheduler: cosine
  early_stopping_patience: 10

data_config:
  validation_split: 0.15
  test_split: 0.15
  random_seed: 42
  num_workers: 4

preprocessing:
  mean: [0.485, 0.456, 0.406]
  std: [0.229, 0.224, 0.225]
  resize: [224, 224]
  normalize: true

augmentation:
  horizontal_flip: true
  vertical_flip: false
  rotation_degrees: 15
  brightness_range: [0.8, 1.2]
  contrast_range: [0.8, 1.2]
