#!/usr/bin/env python3

model: UNet
architecture: UNet
purpose: experimental_research

model_config:
  in_channels: 3
  out_channels: 1
  base_filters: 64
  depth: 4
  use_batch_norm: true
  dropout_rate: 0.0
  bilinear: true
  input_size: [224, 224]

training_config:
  batch_size: 8
  num_epochs: 100
  learning_rate: 0.001
  weight_decay: 0.0001
  optimizer: adam
  scheduler: cosine

preprocessing:
  mean: [0.485, 0.456, 0.406]
  std: [0.229, 0.224, 0.225]
  resize: [224, 224]
  normalize: true

augmentation:
  horizontal_flip: true
  vertical_flip: false
  rotation_degrees: 30

notes: >
  This U-Net architecture is experimental research infrastructure.
  It is NOT clinically validated. Do not train it without proper research oversight.
  Do not generate segmentation masks without expert validation.
