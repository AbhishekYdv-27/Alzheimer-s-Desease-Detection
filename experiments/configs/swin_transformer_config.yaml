#!/usr/bin/env python3

model: SwinTransformer
architecture: SwinTransformer
num_classes: 4
class_names:
  - NonDemented
  - VeryMildDemented
  - MildDemented
  - ModerateDemented

model_config:
  pretrained: false
  freeze_backbone: false
  embed_dim: 96
  depths: [2, 2, 6, 2]
  num_heads: [3, 6, 12, 24]
  window_size: 7
  patch_size: 4
  mlp_ratio: 4.0
  drop_rate: 0.0
  attn_drop_rate: 0.0
  drop_path_rate: 0.1
  input_size: [224, 224]

training_config:
  batch_size: 16
  num_epochs: 100
  learning_rate: 0.0001
  weight_decay: 0.05
  optimizer: adamw
  scheduler: cosine
  warmup_epochs: 5
  early_stopping_patience: 15

data_config:
  validation_split: 0.15
  test_split: 0.15
  random_seed: 42
  num_workers: 4

preprocessing:
  mean: [0.485, 0.456, 0.406]
  std: [0.229, 0.224, 0.225]
  resize: [224, 224]
  normalize: true

augmentation:
  horizontal_flip: true
  vertical_flip: false
  rotation_degrees: 15
  brightness_range: [0.8, 1.2]
  contrast_range: [0.8, 1.2]
  mixup_alpha: 0.2
